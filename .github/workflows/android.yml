name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Verify Gradle wrapper JAR
        run: sha256sum --check gradle-wrapper.jar.sha256
        working-directory: android/gradle/wrapper
      - run: ./gradlew --version
        working-directory: android
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
      - run: ./gradlew :app:testDebugUnitTest :app:lintRelease --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: today-courses-arm64-test
          path: build/app/outputs/flutter-apk/app-release.apk
